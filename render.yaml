# Render Blueprint — Hoshi Backend (NestJS + Prisma + Neon Postgres).
#
# Cara pakai (sekali):
#   1. Push repo ini ke GitHub (sudah).
#   2. Render Dashboard → New + → Blueprint → pilih repo `hoshi-backend`.
#   3. Render membaca file ini, lalu MINTA kamu isi env var bertanda `sync: false`
#      (DATABASE_URL, FRONTEND_ORIGIN, PLATFORM_SECRET_KEY). Isi di dashboard.
#   4. Apply → Render build & deploy otomatis.
#
# Catatan free tier: service "tidur" setelah ~15 menit idle; request pertama
# setelah tidur butuh ~30–50 detik untuk bangun (cold start). Wajar untuk demo.
services:
  - type: web
    name: hoshi-backend
    runtime: node
    plan: free
    region: singapore # dekat dengan Neon (ap-southeast-1)
    branch: main
    # postinstall menjalankan `prisma generate`; lalu `nest build`.
    buildCommand: npm install && npm run build
    # Terapkan migrasi ke Neon, lalu jalankan server.
    startCommand: npm run prisma:deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      # ── WAJIB (isi manual di dashboard) ──
      - key: DATABASE_URL # Neon POOLED (host ber-sufiks `-pooler`), rahasia
        sync: false
      - key: DIRECT_URL # Neon DIRECT (tanpa `-pooler`) — dipakai `prisma migrate deploy`
        sync: false
      - key: JWT_SECRET # Render generate otomatis (>=32 char)
        generateValue: true
      # ── Frontend origin untuk CORS (isi URL Vercel-mu nanti, mis. https://hoshi.vercel.app) ──
      - key: FRONTEND_ORIGIN
        sync: false
      # ── Upload gambar listing (WAJIB di produksi) ──
      # Tanpa ini, POST /admin/upload menolak (fail-fast) agar tidak menyimpan URL
      # rusak. Ambil di Cloudinary Dashboard → Settings → API Keys.
      # Format: cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CLOUDINARY_URL
        sync: false
      # ── Solana ──
      # `sync: false`, BUKAN `value:`. Sebagai `value:` literal, keempat var di bawah ini
      # dikelola blueprint — artinya sekali saja blueprint di-re-sync, nilai yang kamu set
      # di dashboard DITIMPA dan produksi diam-diam kembali ke devnet + inventory mock.
      # Itu jenis kegagalan yang tidak menimbulkan error apa pun; ia cuma menjual kartu palsu.
      #
      # ⚠️ Mengubah baris ini TIDAK mengubah nilai yang sedang berjalan di service yang sudah ada
      #    — nilai aslinya tetap harus diisi di Render Dashboard.
      - key: SOLANA_RPC_URL # mainnet: WAJIB RPC berbayar, endpoint publik akan kena rate-limit
        sync: false
      - key: SOLANA_CLUSTER # devnet | mainnet-beta
        sync: false
      - key: INVENTORY_PROVIDER
        sync: false
      - key: DEFAULT_METADATA_URI
        sync: false
      # ── Opsional: hanya jika mau mint NFT beneran (dompet platform) ──
      - key: PLATFORM_SECRET_KEY
        sync: false

      # ── CollectorCrypt Gacha ──
      # BASE_URL menentukan produk yang benar-benar diterima user:
      #   https://dev-gacha.collectorcrypt.com  → kartu TEST (devnet), tidak bernilai
      #   https://gacha.collectorcrypt.com      → kartu ASLI (butuh API key produksi)
      # Dideklarasikan di sini supaya nilainya WAJIB terlihat saat deploy, bukan diam-diam
      # jatuh ke default dev di dalam kode.
      - key: COLLECTORCRYPT_GACHA_BASE_URL
        sync: false
      - key: COLLECTORCRYPT_GACHA_API_KEY
        sync: false

      # ── Treasury (dompet yang MEMBAYAR setiap pack) ──
      # SECRET_KEY = rahasia terbesar sistem ini. ADDRESS dipakai memverifikasi bahwa IDRX
      # benar-benar mencetak ke dompet kita; kalau kosong, order yang SUDAH DIBAYAR tidak
      # bisa diverifikasi dan tersangkut.
      - key: HOSHI_TREASURY_SECRET_KEY
        sync: false
      - key: HOSHI_TREASURY_ADDRESS
        sync: false
      # Plafon belanja — pengaman nominal, bukan sekadar tuning.
      - key: GACHA_MAX_PACK_PRICE_USDC
        sync: false
      - key: GACHA_TREASURY_DAILY_CAP_USDC
        sync: false
      - key: HOSHI_MAX_SLIPPAGE_BPS
        sync: false

      # ── IDRX (on-ramp rupiah) ──
      # Divalidasi LAZY: salah isi baru ketahuan saat order PERTAMA dibuat, bukan saat boot.
      - key: IDRX_API_KEY
        sync: false
      - key: IDRX_API_SECRET
        sync: false
      - key: IDRX_NETWORK_CHAIN_ID # Solana = 2 (terverifikasi dari frontend IDRX sendiri)
        sync: false
      - key: HOSHI_PAYMENT_RETURN_URL
        sync: false
      - key: HOSHI_PACK_MARGIN_BPS # kosong = 0 = jual seharga modal
        sync: false
